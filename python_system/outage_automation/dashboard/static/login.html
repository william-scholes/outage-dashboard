<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - {{BRAND_TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --danger-bg: rgba(239, 68, 68, 0.15);
    --warning-bg: rgba(245, 158, 11, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .login-container {
    width: 100%; max-width: 400px;
    padding: 24px; margin: 16px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
  }
  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-header h1 {
    font-size: 20px; font-weight: 600;
    margin: 0 0 6px; color: #f8fafc;
    letter-spacing: 0.3px;
  }
  .login-header p {
    margin: 0; font-size: 13px; color: var(--text-dim);
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block; font-size: 13px; font-weight: 500;
    margin-bottom: 6px; color: var(--text);
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    background: #0b1220;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  .btn-submit {
    width: 100%;
    padding: 11px 16px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
    margin-top: 8px;
  }
  .btn-submit:hover {
    background: #7dd3fc;
  }
  .btn-submit:active {
    background: #38bdf8;
  }
  .login-alert {
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.4;
  }
  .login-alert.error {
    background: var(--danger-bg);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
  }
  .login-alert.warning {
    background: var(--warning-bg);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fcd34d;
  }
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>{{BRAND_TITLE}}</h1>
      <p>Sign in with your credentials to continue</p>
    </div>
    {{ERROR_HTML}}
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{NEXT}}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{USERNAME}}" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
