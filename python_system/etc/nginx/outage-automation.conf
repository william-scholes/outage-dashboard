# Nginx reverse proxy configuration for Outage Automation Dashboard
# Upstream bound to 127.0.0.1:8765

server {
    listen 80;
    server_name outages.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name outages.local;

    ssl_certificate /etc/ssl/certs/outage-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/outage-dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Keep-Alive support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer limits
        client_max_body_size 256k;
    }
}
