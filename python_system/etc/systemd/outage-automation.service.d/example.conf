# Example drop-in for the outage-automation* systemd units.
#
# The committed units are intentionally generic — they don't pin the install
# path or the service user. Host-specific config (User, ReadWritePaths,
# backup destination, etc.) lives in a per-host drop-in.
#
# Install for a given unit:
#   sudo mkdir -p /etc/systemd/system/<unit>.d
#   sudo cp example.conf /etc/systemd/system/<unit>.d/<host>.conf
#   sudo systemctl daemon-reload
#
# Repeat for each of:
#   - outage-automation.service             (ingest)
#   - outage-automation-dashboard.service   (HTTP server)
#   - outage-automation-backup.service      (state snapshot)
#
# You can symlink the same file into all three .d/ directories if the config
# applies to each (the example below does). The backup service needs the
# extra /var paths — see the comment at the bottom.

[Service]
# Run the service as a non-root user. Choose whichever account owns the
# state directory. For a /opt/ install with a dedicated system user, use
# `User=outage-automation`. For a /home/<user>/ install, use that user.
User=outage-automation
Group=outage-automation

# The committed units leave ReadWritePaths unset (so the units themselves
# are portable). Add it here to gate writes to just the state directory.
# For a /opt/ install:
# ReadWritePaths=/opt/outage-automation/python_system/state
# For a /home/<user>/ install:
# ReadWritePaths=/home/<user>/outage-automation/python_system/state

# For the backup service (oa-backup-restic.sh), the drop-in needs the
# restic repo + cache directories in ReadWritePaths too. The committed
# unit calls the restic wrapper, which writes to:
#   - /var/backups/oa-restic    (the restic repo itself)
#   - /var/cache/oa-restic      (restic's XDG_CACHE_HOME)
# For an off-host repo, replace /var/backups/oa-restic with the remote
# path (S3, SFTP, etc.) and ensure the dest is mounted/accessible.
# ReadWritePaths=/var/backups/oa-restic /var/cache/oa-restic /opt/outage-automation/python_system/state
